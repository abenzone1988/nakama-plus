apiVersion: v1
kind: Namespace
metadata:
  name: starhold
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nakama-config
  namespace: starhold
data:
  nakama.yaml: |
    data_dir: "/nakama/data"

    logger:
      stdout: true
      level: "info"
      file: "/var/lib/nakama/data/logfile.log"
      max_age: 30
      max_size: 100
      rotation: true

    database:
      address: [] # 留空，通过 StatefulSet 的启动参数 --database.address 动态注入
      
    runtime:
      path: "/nakama/data/modules"
      http_key: "spark_http_key"

    socket:
      server_key: "sparkgame" 

    session:
      encryption_key: "spark_encryption_key"
      token_expiry_sec: 7200
      refresh_encryption_key: "spark_refresh_encryption_key"
      refresh_token_expiry_sec: 2592000
      single_socket: true

    console:   
      username: "admin"
      password: "S7@kP9#vX2"
      signing_key: "spark_signing_key"
  
    cluster:
      gossip_bindaddr: "0.0.0.0"
      gossip_bindport: 7335
      # gossip_advertise_addr 留空，通过环境变量 NAKAMA_CLUSTER_GOSSIP_ADVERTISE_ADDR 动态注入
      etcd:
        endpoints:
          - "etcd-client.starhold.svc.cluster.local:2379"

    grpc:
      access_token: "spark_grpc_token"
      heartbeat_timeout: 15
      ca_cert: "/var/lib/nakama/certs/CA.pem"
      server_name_override: "starhold.uk"

