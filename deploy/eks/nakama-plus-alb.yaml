apiVersion: apps/v1
kind: Deployment
metadata:
  name: nakama-plus
  namespace: default
  labels:
    app: nakama-plus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nakama-plus
  template:
    metadata:
      labels:
        app: nakama-plus
    spec:
      containers:
        - name: nakama
          # 生产环境使用 latest（对应 ECR:starhold-us/nakama-plus:latest）
          image: 746669197317.dkr.ecr.us-east-1.amazonaws.com/starhold-us/nakama-plus:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 7350
            - name: ws
              containerPort: 7351
          env:
            - name: PGHOST
              valueFrom: { secretKeyRef: { name: starhold-db, key: host } }
            - name: PGPORT
              valueFrom: { secretKeyRef: { name: starhold-db, key: port } }
            - name: PGUSER
              valueFrom: { secretKeyRef: { name: starhold-db, key: username } }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: starhold-db, key: password } }
            - name: PGDATABASE
              valueFrom: { secretKeyRef: { name: starhold-db, key: database } }
          command: ["/bin/sh", "-ec"]
          args:
            - >
              DB="postgres:${PGPASSWORD}@${PGHOST}:${PGPORT}/${PGDATABASE}";
              /nakama/nakama migrate up --database.address "$DB";
              exec /nakama/nakama
              --name nakama1
              --database.address "$DB"
              --logger.level INFO
              --session.token_expiry_sec 7200
          volumeMounts:
            - name: data
              mountPath: /nakama/data
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 7350
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 7350
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 6
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nakama-plus-data

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nakama-plus-data
  namespace: default
  labels:
    app: nakama-plus
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi

---
apiVersion: v1
kind: Service
metadata:
  name: nakama-plus
  namespace: default
  labels:
    app: nakama-plus
spec:
  type: ClusterIP
  selector:
    app: nakama-plus
  ports:
    - name: http
      port: 7350
      targetPort: http
    - name: ws
      port: 7351
      targetPort: ws

---
apiVersion: v1
kind: Service
metadata:
  name: nakama-plus-http
  namespace: default
  labels:
    app: nakama-plus
spec:
  type: ClusterIP
  selector:
    app: nakama-plus
  ports:
    - name: http
      port: 80
      targetPort: http

---
apiVersion: v1
kind: Service
metadata:
  name: nakama-plus-ws
  namespace: default
  labels:
    app: nakama-plus
spec:
  type: ClusterIP
  selector:
    app: nakama-plus
  ports:
    - name: ws
      port: 80
      targetPort: ws

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nakama-plus-ingress
  namespace: default
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: "<ACM_CERT_ARN>"
    alb.ingress.kubernetes.io/healthcheck-path: "/healthcheck"
spec:
  ingressClassName: alb
  rules:
    - host: api.starhold.uk
      http:
        paths:
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: nakama-plus-ws
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nakama-plus-http
                port:
                  number: 80

