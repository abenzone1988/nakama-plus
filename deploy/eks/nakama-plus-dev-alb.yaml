apiVersion: apps/v1
kind: Deployment
metadata:
  name: nakama-plus-dev
  namespace: default
  labels:
    app: nakama-plus-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nakama-plus-dev
  template:
    metadata:
      labels:
        app: nakama-plus-dev
    spec:
      containers:
        - name: server
          image: 746669197317.dkr.ecr.us-east-1.amazonaws.com/starhold-us/nakama-plus:ce73ab7
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 7350
            - name: ws
              containerPort: 7351
          env:
            - name: PGHOST
              valueFrom: { secretKeyRef: { name: starhold-db, key: host } }
            - name: PGPORT
              valueFrom: { secretKeyRef: { name: starhold-db, key: port } }
            - name: PGUSER
              valueFrom: { secretKeyRef: { name: starhold-db, key: username } }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: starhold-db, key: password } }
            - name: PGDATABASE
              valueFrom: { secretKeyRef: { name: starhold-db, key: database } }
          command: ["/bin/sh", "-ec"]
          args:
            - >
              # 显式打印当前连接的数据库名（脱敏）
              echo "Connecting to Host: $PGHOST, Database: $PGDATABASE"
              
              # 强制使用 sslmode=require，这对 AWS RDS 非常重要
              DB_URL="postgres://${PGUSER}@${PGHOST}:${PGPORT}/${PGDATABASE}?sslmode=require"
              
              /nakama/nakama migrate up --database.address "$DB_URL"
              
              exec /nakama/nakama --name nakama-dev --database.address "$DB_URL" --logger.level DEBUG --session.token_expiry_sec 7200
          readinessProbe:
            httpGet: { path: /healthcheck, port: 7350 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthcheck, port: 7350 }
            initialDelaySeconds: 30
            periodSeconds: 15

---
apiVersion: v1
kind: Service
metadata:
  name: nakama-plus-dev-http
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: nakama-plus-dev
  ports:
    - name: http
      port: 80
      targetPort: http

---
apiVersion: v1
kind: Service
metadata:
  name: nakama-plus-dev-ws
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: nakama-plus-dev
  ports:
    - name: ws
      port: 80
      targetPort: ws

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nakama-plus-dev-ingress
  namespace: default
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: "<ACM_CERT_ARN>"
    alb.ingress.kubernetes.io/healthcheck-path: "/healthcheck"
spec:
  ingressClassName: alb
  rules:
    - host: dev-api.starhold.uk
      http:
        paths:
          - path: /ws
            pathType: Prefix
            backend:
              service: { name: nakama-plus-dev-ws, port: { number: 80 } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: nakama-plus-dev-http, port: { number: 80 } }

